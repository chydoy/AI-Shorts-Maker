services:
  db:
    image: postgres:15-alpine
    container_name: shorts_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_shorts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shorts_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: shorts_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./shared_media:/shared/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_shorts_db
      REDIS_URL: redis://redis:6379/0
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: shorts_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - web

  worker:
    build: .
    container_name: shorts_worker
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - ./shared_media:/shared/media
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_shorts_db
      REDIS_URL: redis://redis:6379/0
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
